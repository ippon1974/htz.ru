<!DOCTYPE html>
<head>
    <title>Test POST</title>
</head>
  
<body>

<h1>OSEL</h1>

<form id="formElem">
  <input type="text" name="name" value="Vovan">
  <input type="text" name="surname" value="Osel">
  <button type="submit">Submit</button>
</form>

<script>

 formElem.onsubmit = async (e) => {
  e.preventDefault();
  object= {};
  const formData = new FormData(formElem);
  const name = formData.get('name'); 
  const surname = formData.get('surname');
  formData.forEach((value, key) => object[key] = value);
  var txt = JSON.stringify(object);
  console.log(txt);

  const response = await fetch('https://htz.ru/api/post/order/makestone/', {
    method: 'post',
    body: txt
  });

  // Check if there is actually content to read
  if (response.status === 204 || response.headers.get("content-length") === "0") {
    console.log("Success, but no JSON body returned.");
    return;
  }
  const data = await response.json(); // Safe to call now
  console.log("data ", data);
};

</script>

</body>
</html>
